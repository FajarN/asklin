  <rect x="50" y="340" width="60" height="18" rx="9" fill="#fee2e2"/>
  <text x="80" y="352" fill="#b91c1c" font-size="8" font-family="sans-serif" font-weight="bold" text-anchor="middle">AGENDA</text>
  <rect x="50" y="366" width="170" height="13" rx="3" fill="#0f172a"/>
  <rect x="50" y="385" width="190" height="8" rx="2" fill="#64748b"/>
  <rect x="50" y="399" width="160" height="8" rx="2" fill="#64748b"/>
  <rect x="50" y="445" width="198" height="22" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>

  <rect x="287" y="325" width="226" height="155" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="301" y="340" width="60" height="18" rx="9" fill="#dbeafe"/>
  <text x="331" y="352" fill="#1e40af" font-size="8" font-family="sans-serif" font-weight="bold" text-anchor="middle">BERITA</text>
  <rect x="301" y="366" width="180" height="13" rx="3" fill="#0f172a"/>
  <rect x="301" y="385" width="190" height="8" rx="2" fill="#64748b"/>
  <rect x="301" y="399" width="150" height="8" rx="2" fill="#64748b"/>
  <rect x="301" y="445" width="198" height="22" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>

  <rect x="538" y="325" width="226" height="155" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="552" y="340" width="70" height="18" rx="9" fill="#fef3c7"/>
  <text x="587" y="352" fill="#b45309" font-size="8" font-family="sans-serif" font-weight="bold" text-anchor="middle">PROGRAM</text>
  <rect x="552" y="366" width="170" height="13" rx="3" fill="#0f172a"/>
  <rect x="552" y="385" width="190" height="8" rx="2" fill="#64748b"/>
  <rect x="552" y="399" width="140" height="8" rx="2" fill="#64748b"/>
  <rect x="552" y="445" width="198" height="22" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>

