<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="m-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#2a0815"/>
    </linearGradient>
    <linearGradient id="m-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="m-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
  </defs>
  <!-- Main Canvas Dark Modern Frame -->
  <rect width="800" height="500" rx="12" fill="#f1f5f9"/>

  <!-- Browser Chrome -->
  <rect width="800" height="32" rx="12" fill="#020617"/>
  <circle cx="24" cy="16" r="5" fill="#f43f5e"/>
