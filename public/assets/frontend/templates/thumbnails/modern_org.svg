  <rect x="250" y="8" width="300" height="16" rx="8" fill="#0f172a"/>
  <text x="400" y="20" fill="#fca5a5" font-size="10" font-family="sans-serif" text-anchor="middle">asklin.org — Template 3: Modern Organization (Dynamic)</text>

  <!-- Modern Hero + Header Combined Canvas -->
  <rect y="32" width="800" height="280" fill="url(#m-bg)"/>

