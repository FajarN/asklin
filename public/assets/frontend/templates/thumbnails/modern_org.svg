  <circle cx="75" cy="137" r="4" fill="#ef4444"/>
  <text x="155" y="141" fill="#fca5a5" font-size="9" font-family="sans-serif" font-weight="bold" text-anchor="middle">Transformasi Klinik Indonesia</text>

