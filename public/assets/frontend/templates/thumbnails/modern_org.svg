  <rect x="620" y="46" width="134" height="20" rx="4" fill="#dc2626"/>
  <text x="687" y="60" fill="#ffffff" font-size="9" font-family="sans-serif" font-weight="bold" text-anchor="middle">Modern Org (Dynamic)</text>
