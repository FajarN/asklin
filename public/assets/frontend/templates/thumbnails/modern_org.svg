  <rect x="510" y="250" width="215" height="26" rx="13" fill="#dc2626" fill-opacity="0.2"/>
  <text x="617" y="266" fill="#fca5a5" font-size="9" font-family="sans-serif" font-weight="bold" text-anchor="middle">● Akreditasi &amp; Advokasi Siaga</text>

